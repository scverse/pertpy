fail_fast: false
ci:
    skip: [mypy] # needs the project environment, which pre-commit.ci cannot provide
default_language_version:
    python: python3
default_stages:
    - pre-commit
    - pre-push
minimum_pre_commit_version: 2.16.0
repos:
    - repo: https://github.com/biomejs/pre-commit
      rev: 742ab683a70977bd4648797d799ddd6b5496ae87 # frozen: v2.5.13
      hooks:
          - id: biome-format
            exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: e8f7d69b957a30acb2c875078d5fd012de24b64c # frozen: v0.16.7
      hooks:
          - id: ruff-check
            args: [--fix, --exit-non-zero-on-fix, --unsafe-fixes]
          - id: ruff-format
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
      hooks:
          - id: detect-private-key
          - id: check-ast
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: trailing-whitespace
          - id: check-case-conflict
          - id: check-added-large-files
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
    - repo: local
      hooks:
          - id: mypy
            name: mypy
            entry: uv run --extra dev --extra de --extra jax --extra tcoda --extra test mypy src/pertpy tests
            language: system
            types: [python]
            files: ^(src/pertpy|tests)/
            require_serial: true
            pass_filenames: false
    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
      hooks:
          - id: zizmor
            args: [--no-progress, --fix]
