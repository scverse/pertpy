fail_fast: false
ci:
    skip: [mypy] # needs the project environment, which pre-commit.ci cannot provide
default_language_version:
    python: python3
default_stages:
    - pre-commit
    - pre-push
minimum_pre_commit_version: 2.16.0
repos:
    - repo: https://github.com/biomejs/pre-commit
      rev: 06894e75c7c22ab408daf8e1ad00c2fe81512f08 # frozen: v2.5.5
      hooks:
          - id: biome-format
            exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # frozen: v0.16.0
      hooks:
          - id: ruff-check
            args: [--fix, --exit-non-zero-on-fix, --unsafe-fixes]
          - id: ruff-format
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
      hooks:
          - id: detect-private-key
          - id: check-ast
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: trailing-whitespace
          - id: check-case-conflict
          - id: check-added-large-files
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
    - repo: local
      hooks:
          - id: mypy
            name: mypy
            entry: uv run --extra dev --extra de --extra tcoda --extra test mypy src/pertpy tests
            language: system
            types: [python]
            files: ^(src/pertpy|tests)/
            require_serial: true
            pass_filenames: false
    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: 067260dc5fe6ea86b7551bfd6f8b3ba4e6c93129 # frozen: v1.28.0
      hooks:
          - id: zizmor
            args: [--no-progress, --fix]
